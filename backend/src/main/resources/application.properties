spring.application.name=workSpace
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://localhost:5432/coworkingsdb
spring.datasource.username=serega
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC
jwt.secret=${JWT_SECRET:change-this-secret-to-at-least-32-bytes}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:*}
