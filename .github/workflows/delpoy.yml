name: CI/CD Pipeline to Railway

on:
  push:
    branches: [ "main", "master" ] # Срабатывает при пуше в main или master
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # --- СБОРКА И ТЕСТИРОВАНИЕ БЭКЕНДА ---
  backend-ci-cd:
    name: Backend CI/CD
    runs-on: ubuntu-latest
    # Пайплайн запустится, только если изменились файлы в папке backend
    if: github.event_name == 'push' || contains(github.event.head_commit.modified, 'backend/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21 # Замени на свою версию Java, если нужно (например, 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test Backend
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests=false

      # Деплой бэка на Railway (только при пуше в основную ветку)
      - name: Deploy Backend to Railway
        if: github.event_name == 'push'
        run: |
          npm i -g @railway/cli
          cd backend
          railway up --detach --project ${{ secrets.RAILWAY_PROJECT_ID }} --service ${{ secrets.RAILWAY_BACKEND_SERVICE }} --environment=production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # --- СБОРКА И ТЕСТИРОВАНИЕ ФРОНТЕНДА ---
  frontend-ci-cd:
    name: Frontend CI/CD
    runs-on: ubuntu-latest
    # Пайплайн запустится, только если изменились файлы в папке frontend
    if: github.event_name == 'push' || contains(github.event.head_commit.modified, 'frontend/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Рекомендуемая стабильная версия для Vite
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      # Деплой фронта на Railway (только при пуше в основную ветку)
      - name: Deploy Frontend to Railway
        if: github.event_name == 'push'
        run: |
          npm i -g @railway/cli
          cd frontend
          railway up --detach --project ${{ secrets.RAILWAY_PROJECT_ID }} --service ${{ secrets.RAILWAY_FRONTEND_SERVICE }} --environment=production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  healthcheck:
    name: Service Healthcheck
    runs-on: ubuntu-latest
    # Запускается только при пуше (когда был деплой) и строго после завершения бэка и фронта
    if: github.event_name == 'push'
    needs: [ backend-ci-cd, frontend-ci-cd ]

    steps:
      - name: Wait for services to roll out
        run: sleep 20 # Даем Railway 20 секунд, чтобы поднять новые контейнеры

      - name: Check Backend Health
        run: |
          echo "Checking Backend..."
          curl --fail --retry 5 --retry-delay 10 --retry-all-errors ${{secrets.BACKEND_HEALTHCHECK_URL}} || exit 1
